<!doctype html>
<html lang="{{ site.Language.Locale }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}">
    <meta name="author" content="{{ site.Params.author }}">
    <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} | {{ site.Title }}{{ end }}</title>
    <link rel="canonical" href="{{ .Permalink }}">
    <link rel="stylesheet" href="{{ "assets/css/site.css" | relURL }}">
    <link rel="alternate" type="application/rss+xml" title="{{ site.Title }}" href="{{ "feeds/posts/default/index.xml" | relURL }}">
  </head>
  <body>
    <header class="site-header">
      <div class="site-header__inner">
        <a class="site-title" href="{{ site.Home.RelPermalink }}">{{ site.Title }}</a>
        <p class="site-description">{{ site.Params.description }}</p>
        <nav aria-label="Main">
          <ul class="nav-list">
            {{ range site.Menus.main }}
              <li><a href="{{ .URL }}"{{ if $.IsMenuCurrent "main" . }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
            {{ end }}
          </ul>
        </nav>
        <nav aria-label="Elsewhere">
          <ul class="nav-list nav-list--social">
            {{ range site.Menus.social }}
              <li><a href="{{ .URL }}"{{ if hasPrefix .URL "http" }} rel="me"{{ end }}>{{ .Name }}</a></li>
            {{ end }}
          </ul>
        </nav>
      </div>
    </header>
    <main id="content" class="content">
      {{ block "main" . }}{{ end }}
    </main>
  </body>
</html>
